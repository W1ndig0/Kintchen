<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0c">
<title>Kitchen Hub TV</title>
<style>
:root { --bg: #0e0d0b; --ink: #f3efe6; --mute: #a39d90; --rule: #3a3731; --hi: #f3efe6; --card: #171613; }
body.day { --bg: #f4f1ea; --ink: #141311; --mute: #6c675d; --rule: #cfc9bc; --hi: #141311; --card: #fffdf8; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: Georgia, "Times New Roman", serif; cursor: none; }
#stage { position: absolute; inset: 2.2vh 2.6vw; transition: transform 2s; }
.mast { display: flex; align-items: baseline; justify-content: space-between; border-bottom: .5vh double var(--ink); padding-bottom: .6vh; }
.mast .l, .mast .r { font: 700 1.5vw/1 Helvetica, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); }
.mast .c { font-weight: 900; font-size: 3vw; letter-spacing: .14em; text-transform: uppercase; }
.slide { position: absolute; left: 0; right: 0; top: 7.5vh; bottom: 4vh; opacity: 0; transition: opacity 1.2s; }
.slide.on { opacity: 1; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font: 600 1.1vw/1 Helvetica, Arial, sans-serif; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.dots span { display: inline-block; width: .9vw; height: .9vw; border: 2px solid var(--mute); border-radius: 50%; margin-left: .5vw; }
.dots span.on { background: var(--ink); border-color: var(--ink); }
.cols { display: flex; gap: 2.5vw; height: 100%; }
.col { flex: 1; min-width: 0; }
.k { font: 800 1.15vw/1.1 Helvetica, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin: 2.2vh 0 .8vh; border-top: 1px solid var(--rule); padding-top: 1vh; }
.k:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.clock { font-weight: 900; font-size: 15vw; line-height: .9; letter-spacing: -.04em; white-space: nowrap; }
.clock small { font-size: .26em; letter-spacing: .04em; margin-left: .2em; }
.date { font-size: 2.6vw; font-style: italic; margin-top: 1vh; }
.big { font-size: 2.6vw; font-weight: 900; line-height: 1.15; }
.li { font-size: 2vw; line-height: 1.3; margin: .4vh 0; }
.li b { font-family: Helvetica, Arial, sans-serif; font-size: .7em; letter-spacing: .12em; text-transform: uppercase; margin-right: .6vw; }
.pill { display: inline-block; background: var(--ink); color: var(--bg); font: 800 1.6vw/1 Helvetica, Arial, sans-serif; padding: .5vh .8vw; letter-spacing: .04em; }
.who-solid { background: var(--ink) !important; color: var(--bg) !important; }
.who-outline { background: transparent !important; color: var(--ink) !important; outline: .25vw solid var(--ink); }
.who-striped { background: repeating-linear-gradient(45deg, var(--ink) 0 .2vw, var(--bg) .2vw .7vw) !important; color: var(--ink) !important; outline: .25vw solid var(--ink); text-shadow: 0 0 .3vw var(--bg), 0 0 .3vw var(--bg); }
.who-dotted { background: transparent !important; color: var(--ink) !important; outline: .25vw dotted var(--ink); }
.who-double { background: transparent !important; color: var(--ink) !important; outline: .5vw double var(--ink); }
.who-underline { background: transparent !important; color: var(--ink) !important; border-bottom: .3vw solid var(--ink); }
.wb { display: inline-block; min-width: 1.4em; text-align: center; font: 800 .7em/1.4 Helvetica, Arial, sans-serif; }
.pill { margin-right: .5vw; }
.note { border: .4vh double var(--ink); padding: 1.2vh 1.2vw; font-size: 2.3vw; font-style: italic; margin: 1vh 0; }
.wxnow { display: flex; align-items: center; gap: 1.5vw; }
.wxnow .t { font-size: 7vw; font-weight: 900; line-height: 1; }
.wxnow .d { font-size: 2vw; }
.days { display: flex; gap: .8vw; margin-top: 1.5vh; }
.days div { flex: 1; text-align: center; border: 1px solid var(--rule); padding: 1vh .3vw; font-size: 1.6vw; }
.days div b { display: block; font: 800 1.1vw Helvetica, Arial, sans-serif; letter-spacing: .14em; color: var(--mute); }
.week { display: flex; gap: .8vw; height: 100%; }
.wd { flex: 1; border: 1px solid var(--rule); background: var(--card); padding: 1.2vh .8vw; overflow: hidden; }
.wd.today { border: .4vh solid var(--ink); }
.wd h3 { margin: 0 0 1vh; font: 800 1.3vw/1.1 Helvetica, Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
.wd h3 span { display: block; font: 900 3.4vw/1 Georgia, serif; letter-spacing: 0; }
.wd .e { font-size: 1.5vw; line-height: 1.25; margin: .7vh 0; }
.wd .e i { color: var(--mute); }
.wd .din { margin-top: 1.5vh; border-top: 1px solid var(--rule); padding-top: .8vh; font-size: 1.4vw; font-style: italic; }
.chips span { display: inline-block; border: .3vh solid var(--ink); padding: .7vh 1vw; margin: 0 .7vw 1vh 0; font-size: 2vw; }
.hl { font-size: 3.6vw; font-weight: 900; line-height: 1.08; }
.body { font-size: 1.9vw; line-height: 1.45; margin-top: 1.5vh; }
.more div { font-size: 1.7vw; line-height: 1.3; padding: .9vh 0; border-bottom: 1px solid var(--rule); }
.src { font: 800 1vw Helvetica, Arial, sans-serif; letter-spacing: .14em; background: var(--ink); color: var(--bg); padding: .2vh .4vw; margin-right: .6vw; vertical-align: middle; }
.cook { position: absolute; inset: 0; background: var(--bg); display: none; padding: 3vh 4vw; }
.cook .st { font-size: 4.4vw; line-height: 1.25; margin-top: 4vh; }
.cook .n { font: 800 1.4vw Helvetica, Arial, sans-serif; letter-spacing: .2em; color: var(--mute); }
.pick div { font-size: 2.2vw; padding: 1vh 1vw; border-bottom: 1px solid var(--rule); }
.pick div.sel { background: var(--ink); color: var(--bg); }
#setup { position: absolute; inset: 0; display: none; padding: 8vh 8vw; font-size: 2vw; background: var(--bg); cursor: auto; }
#setup input { font-size: 2vw; padding: 1vh 1vw; width: 70%; margin: 1vh 0; }
#setup button { font-size: 2vw; padding: 1vh 2vw; }
.photo { position: absolute; inset: 0; background-size: contain; background-position: center; background-repeat: no-repeat; }
.night .clock { font-size: 22vw; }
.dim { color: var(--mute); }
</style>
</head>
<body>
<div id="stage">
  <div class="mast"><span class="l" id="m-l"></span><span class="c">The Kitchen Hub</span><span class="r" id="m-r"></span></div>
  <div id="slides"></div>
  <div class="foot"><span id="f-l"></span><span class="dots" id="dots"></span><span id="f-r"></span></div>
  <div class="cook" id="cook"></div>
</div>
<div id="setup">
  <h1 style="font-size:3vw">Kitchen Hub TV</h1>
  <p>Open this page from the phone app (FRIDGE &rsaquo; Copy TV link) or from the fridge's Settings &rsaquo; Phone QR code.</p>
  <p>Or type the code and passphrase:</p>
  <div><input id="s-g" placeholder="owner/cloudgistid"></div>
  <div><input id="s-k" placeholder="passphrase" type="password"></div>
  <button id="s-go">Start</button>
  <p class="dim" style="font-size:1.4vw">Remote / keyboard: &larr; &rarr; change screen &middot; OK/Enter pause &middot; &darr; on the kitchen screen to cook a recipe &middot; D day/night colours.</p>
</div>
<script src="hubdata.js"></script>
<script>
"use strict";
var $ = function(id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var CFG = {};
try { CFG = JSON.parse(localStorage.getItem("kh_tv") || "{}"); } catch (e) {}
(function() {
  var h = location.hash, g = /[#&]g=([A-Za-z0-9_.-]+\/[0-9A-Za-z]+)/.exec(h), k = /[#&]k=([^&]+)/.exec(h), raw = /[#&]raw=([^&]+)/.exec(h);
  if (g) { CFG.g = g[1]; if (k) CFG.k = decodeURIComponent(k[1]); if (raw) CFG.raw = decodeURIComponent(raw[1]); try { localStorage.setItem("kh_tv", JSON.stringify(CFG)); } catch (e) {} history.replaceState(null, "", location.pathname); }
})();
var D = null, SL = 0, PAUSE = false, LAST = 0, THEME = "auto", COOK = null;
var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], MON = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
var WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Freezing fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow", 80: "Showers", 81: "Showers", 82: "Heavy showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunder", 96: "Thunder", 99: "Thunder" };
function now() { var d = new Date(Date.now() + ((D && D.tz) || -7) * 3600000); return d; }       // read with getUTC*
function p2(n) { return (n < 10 ? "0" : "") + n; }
function keyOf(d) { return d.getUTCFullYear() + "-" + p2(d.getUTCMonth() + 1) + "-" + p2(d.getUTCDate()); }
function addK(k, n) { var d = new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10) + n)); return keyOf(d); }
function dow(k) { return new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))).getUTCDay(); }
function fmt(t) { if (!t) return ""; var h = +t.slice(0, 2), m = t.slice(3); return (h % 12 || 12) + (m === "00" ? "" : ":" + m) + (h >= 12 ? "p" : "a"); }
function off(v) { return !v || /^\s*(off|x|-|vac|vacation|sick|stat|holiday)\s*$/i.test(v); }

function load() {
  if (!CFG.g) { $("setup").style.display = "block"; return; }
  var u = (CFG.raw || "https://gist.githubusercontent.com") + "/" + CFG.g + "/raw/tv.json?t=" + Date.now();
  fetch(u, { cache: "no-store" }).then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(j) {
    var t = j.plain ? j.plain : JSON.parse(HubCrypt.unlock(j.locked, CFG.k || "") || "null");
    if (!t) { $("f-r").textContent = "Wrong passphrase"; $("setup").style.display = "block"; return; }
    D = t; LAST = Date.now(); build();
  }).catch(function() { $("f-r").textContent = "Offline - showing the last data"; });
}
function slidesList() {
  var s = ["today", "week", "kitchen", "news", "fridge"];
  if (CFG.photos && CFG.photos.length) s.push("photo");
  var h = now().getUTCHours();
  if (h >= 23 || h < 6) s = ["night"];
  return s;
}
var PH = 0;
function build() {
  if (!D) return;
  var list = slidesList(), html = "";
  if (SL >= list.length) SL = 0;
  list.forEach(function(n, i) { html += '<div class="slide' + (i === SL ? " on" : "") + '" id="sl-' + n + '">' + (R[n] ? R[n]() : "") + "</div>"; });
  $("slides").innerHTML = html;
  $("dots").innerHTML = list.map(function(n, i) { return '<span class="' + (i === SL ? "on" : "") + '"></span>'; }).join("");
  var n = now(), h = n.getUTCHours();
  var dark = THEME === "dark" || (THEME === "auto" && (h >= 18 || h < 8));
  document.body.className = (dark ? "" : "day") + (list[0] === "night" ? " night" : "");
  $("m-l").textContent = DAYS[n.getUTCDay()] + " · " + MON[n.getUTCMonth()] + " " + n.getUTCDate();
  $("m-r").textContent = (h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening") + " edition";
  $("f-l").textContent = PAUSE ? "Paused · OK to resume" : "← → screens · ↓ cook";
  $("f-r").textContent = "Updated " + Math.max(0, Math.round((Date.now() / 1000 - D.ts) / 60)) + " min ago";
}
function clockHtml() { var n = now(), h = n.getUTCHours(); return '<div class="clock">' + (h % 12 || 12) + ":" + p2(n.getUTCMinutes()) + "<small>" + (h >= 12 ? "PM" : "AM") + "</small></div>"; }
function two() { return !!(D.people && D.people.p2 && D.people.p2.name); }
function ini(w) { var p = D.people && D.people[w]; return esc(((p && (p.init || p.name)) || "?").toUpperCase().slice(0, 2)); }
function sty(w) { var p = D.people && D.people[w]; return "who-" + ((p && p.style) || (w === "p2" ? "outline" : "solid")); }
function dayItems(k) {
  var o = [], s = D.shifts[k], s2 = D.shifts2 && D.shifts2[k];
  if (s && !off(s)) o.push('<span class="pill ' + (two() ? sty("p1") : "") + '">' + (two() ? ini("p1") + " " : "") + esc(s) + "</span>");
  if (two() && s2 && !off(s2)) o.push('<span class="pill ' + sty("p2") + '">' + ini("p2") + " " + esc(s2) + "</span>");
  (D.events[k] || []).forEach(function(e) { o.push((e.who && two() ? '<span class="wb ' + sty(e.who) + '">' + ini(e.who) + "</span> " : "") + (e.time ? "<b>" + fmt(e.time) + "</b> " : "") + (e.rep ? "↻ " : "") + esc(e.title)); });
  return o;
}
var R = {
  today: function() {
    var n = now(), k = keyOf(n), t1 = addK(k, 1), w = D.weather, h = '<div class="cols"><div class="col" style="flex:1.25">' + clockHtml() + '<div class="date">' + DAYS[n.getUTCDay()] + ", " + MON[n.getUTCMonth()] + " " + n.getUTCDate() + "</div>";
    (D.notes || []).slice(-2).forEach(function(x) { h += '<div class="note">“' + esc(x.t) + '”</div>'; });
    h += '<div class="k">Today</div>';
    var it = dayItems(k); h += it.length ? it.map(function(x) { return '<div class="li">' + x + "</div>"; }).join("") : '<div class="li dim">Nothing on the calendar.</div>';
    if (D.plan[k]) h += '<div class="li"><b>Dinner</b>' + esc(D.plan[k]) + "</div>";
    h += '<div class="k">Tomorrow</div>';
    var t = dayItems(t1); h += t.length ? t.map(function(x) { return '<div class="li">' + x + "</div>"; }).join("") : '<div class="li dim">Free.</div>';
    h += '</div><div class="col">';
    if (w && w.now) {
      h += '<div class="k">Weather</div><div class="wxnow"><span class="t">' + Math.round(w.now.temperature_2m) + '°</span><span class="d">' + esc(WMO[w.now.weather_code] || "") + (w.daily ? "<br>H " + Math.round(w.daily.temperature_2m_max[0]) + "° · L " + Math.round(w.daily.temperature_2m_min[0]) + "°" : "") + "</span></div>";
      if (w.daily) { h += '<div class="days">'; for (var i = 1; i < Math.min(6, w.daily.time.length); i++) h += "<div><b>" + DAYS[dow(w.daily.time[i])].slice(0, 3) + "</b>" + Math.round(w.daily.temperature_2m_max[i]) + "° / " + Math.round(w.daily.temperature_2m_min[i]) + "°<br><span class='dim' style='font-size:.8em'>" + esc(WMO[w.daily.weather_code[i]] || "") + "</span></div>"; h += "</div>"; }
    }
    if (D.alerts && D.alerts.length) { h += '<div class="k">Alerts</div>'; D.alerts.slice(0, 3).forEach(function(a) { h += '<div class="li"><b>' + esc(a.s) + "</b>" + esc(a.t) + "</div>"; }); }
    if (D.list.length) h += '<div class="k">Shopping list · ' + D.list.length + '</div><div class="li">' + esc(D.list.slice(0, 10).join(" · ")) + "</div>";
    return h + "</div></div>";
  },
  week: function() {
    var k = keyOf(now()), h = '<div class="week">';
    for (var i = 0; i < 7; i++) {
      var d = addK(k, i), it = dayItems(d);
      h += '<div class="wd' + (i === 0 ? " today" : "") + '"><h3>' + DAYS[dow(d)].slice(0, 3) + "<span>" + (+d.slice(8)) + "</span></h3>" +
        (it.length ? it.map(function(x) { return '<div class="e">' + x + "</div>"; }).join("") : '<div class="e"><i>free</i></div>') +
        (D.plan[d] ? '<div class="din">🍽 ' + esc(D.plan[d]) + "</div>" : "") + "</div>";
    }
    return h + "</div>";
  },
  kitchen: function() {
    var k = keyOf(now()), h = '<div class="cols"><div class="col"><div class="k">Shopping list · ' + D.list.length + '</div><div class="chips">' + (D.list.length ? D.list.map(function(x) { return "<span>" + esc(x) + "</span>"; }).join("") : '<span style="border:0" class="dim">Nothing to buy.</span>') + "</div>";
    if (D.chores && D.chores.length) { h += '<div class="k">Chores</div>'; D.chores.slice(0, 6).forEach(function(c) { h += '<div class="li">↻ ' + esc(c.title) + ' <span class="dim">— ' + esc(c.when) + "</span></div>"; }); }
    h += '</div><div class="col"><div class="k">Dinners this week</div>';
    for (var i = 0; i < 7; i++) { var d = addK(k, i); if (D.plan[d]) h += '<div class="li"><b>' + (i ? DAYS[dow(d)].slice(0, 3) : "Tonight") + "</b>" + esc(D.plan[d]) + "</div>"; }
    if (D.recipes.length) h += '<div class="k">Press ↓ to cook one of your ' + D.recipes.length + " recipes on the TV</div>";
    return h + "</div></div>";
  },
  news: function() {
    var a = D.news[0];
    if (!a) return '<div class="hl">The news arrives with the next sync.</div>';
    var h = '<div class="cols"><div class="col" style="flex:1.4"><div class="k">' + esc(a.s) + '</div><div class="hl">' + esc(a.t) + '</div><div class="body">' + esc(a.b) + "</div></div><div class='col'><div class='k'>More</div><div class='more'>";
    D.news.slice(1, 8).forEach(function(x) { h += "<div><span class='src'>" + esc(x.s) + "</span>" + esc(x.t) + "</div>"; });
    if (D.whatson && D.whatson.length) { h += "</div><div class='k'>What's on in P.G.</div><div class='more'>"; D.whatson.slice(0, 4).forEach(function(x) { h += "<div>" + esc(x) + "</div>"; }); }
    return h + "</div></div></div>";
  },
  fridge: function() {
    var kd = D.kindle, h = '<div class="cols"><div class="col"><div class="k">The fridge hub</div>';
    if (kd && kd.ts) h += '<div class="big" style="font-size:6vw">' + kd.pct + "%" + (kd.charging ? " <span style='font-size:.4em'>charging</span>" : "") + "</div>" +
      '<div class="li">' + (kd.left7 > 0 && !kd.charging ? "About " + (kd.left7 >= 48 ? Math.round(kd.left7 / 24) + " days" : kd.left7 + " hours") + " of battery left" : "") + "</div>" +
      '<div class="li dim">Last check-in ' + Math.round((Date.now() / 1000 - kd.ts) / 60) + " min ago · v" + esc(kd.v) + "</div>";
    else h += '<div class="li dim">No check-in yet.</div>';
    (D.pay || []).forEach(function(p) { var nm = two() && D.people[p.who] ? esc(D.people[p.who].name) + " \u00b7 " : ""; h += '<div class="k">' + nm + 'Pay period</div><div class="big">$' + p.gross.toFixed(2) + '</div><div class="li dim">' + p.hours + " h \u00b7 gross \u00b7 payday " + DAYS[dow(p.payday)].slice(0, 3) + " " + MON[+p.payday.slice(5, 7) - 1].slice(0, 3) + " " + (+p.payday.slice(8)) + "</div>"; });
    if (D.otd) h += '<div class="k">On this day · ' + esc(D.otd.year) + '</div><div class="li">' + esc(D.otd.text) + "</div>";
    h += '</div><div class="col">';
    if (D.stocks && D.stocks.length) { h += '<div class="k">Markets</div>'; D.stocks.forEach(function(s) { var ch = s.prev ? (s.price - s.prev) / s.prev * 100 : 0; h += '<div class="li"><b>' + esc(s.sym) + "</b>" + (+s.price).toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' <span class="dim">' + (ch >= 0 ? "▲ " : "▼ ") + Math.abs(ch).toFixed(2) + "%</span></div>"; }); }
    if (D.feed && D.feed.length) { h += '<div class="k">New recipes on the web</div>'; D.feed.slice(0, 5).forEach(function(f) { h += '<div class="li">' + esc(f.t) + "</div>"; }); }
    return h + "</div></div>";
  },
  night: function() {
    var k = keyOf(now()), t1 = now().getUTCHours() < 6 ? k : addK(k, 1), it = dayItems(t1);
    return '<div style="text-align:center;margin-top:6vh">' + clockHtml() + '<div class="date" style="margin-top:3vh">' + (now().getUTCHours() < 6 ? "Today" : "Tomorrow") + ": " + (it.length ? it.join(" · ") : "nothing planned") + "</div></div>";
  },
  photo: function() { var p = CFG.photos[PH % CFG.photos.length]; return '<div class="photo" style="background-image:url(\'' + esc(p) + '\')"></div>'; }
};
function go(d) { var n = slidesList().length; SL = (SL + d + n) % n; if (slidesList()[SL] === "photo") PH++; build(); }
// ---------- cook on the TV ----------
function cookOpen() {
  if (!D || !D.recipes.length) return;
  COOK = { pick: 0, r: null, step: -1 };
  cookDraw();
}
function cookDraw() {
  var c = $("cook"); c.style.display = COOK ? "block" : "none";
  if (!COOK) return;
  if (!COOK.r) {
    c.innerHTML = '<div class="k">Cook on the TV · ↑ ↓ choose · OK open · ← back</div><div class="pick">' + D.recipes.map(function(r, i) { return '<div class="' + (i === COOK.pick ? "sel" : "") + '">' + esc(r.title) + "</div>"; }).join("") + "</div>";
    var sel = c.querySelector(".sel"); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "center" });
    return;
  }
  var r = COOK.r;
  if (COOK.step < 0) c.innerHTML = '<div class="n">' + esc(r.title) + ' · INGREDIENTS · → start</div><div class="st" style="font-size:3vw;columns:2">' + r.ing.map(esc).join("<br>") + "</div>";
  else c.innerHTML = '<div class="n">' + esc(r.title) + " · STEP " + (COOK.step + 1) + " OF " + r.steps.length + ' · ← →</div><div class="st">' + esc(r.steps[COOK.step]) + "</div>";
}
document.addEventListener("keydown", function(e) {
  var k = e.key;
  if (COOK) {
    if (!COOK.r) {
      if (k === "ArrowDown") COOK.pick = Math.min(D.recipes.length - 1, COOK.pick + 1);
      else if (k === "ArrowUp") COOK.pick = Math.max(0, COOK.pick - 1);
      else if (k === "Enter" || k === " " || k === "ArrowRight") { COOK.r = D.recipes[COOK.pick]; COOK.step = COOK.r.ing.length ? -1 : 0; }
      else if (k === "ArrowLeft" || k === "Escape" || k === "Backspace") COOK = null;
    } else {
      if (k === "ArrowRight" || k === "Enter" || k === " ") COOK.step = Math.min(COOK.r.steps.length - 1, COOK.step + 1);
      else if (k === "ArrowLeft") { if (COOK.step <= (COOK.r.ing.length ? -1 : 0)) COOK.r = null; else COOK.step--; }
      else if (k === "Escape" || k === "Backspace") COOK.r = null;
    }
    cookDraw(); e.preventDefault(); return;
  }
  if (k === "ArrowRight") go(1); else if (k === "ArrowLeft") go(-1);
  else if (k === "Enter" || k === " ") { PAUSE = !PAUSE; build(); }
  else if (k === "ArrowDown" && slidesList()[SL] === "kitchen") cookOpen();
  else if (k === "d" || k === "D") { THEME = THEME === "auto" ? "light" : THEME === "light" ? "dark" : "auto"; build(); }
  else return;
  e.preventDefault();
});
document.addEventListener("click", function(e) { if ($("setup").style.display === "block") return; if (e.clientX > innerWidth / 2) go(1); else go(-1); });
$("s-go").addEventListener("click", function() { CFG.g = $("s-g").value.trim(); CFG.k = $("s-k").value; try { localStorage.setItem("kh_tv", JSON.stringify(CFG)); } catch (e) {} $("setup").style.display = "none"; load(); });
// optional photo frame: photos/list.json on your GitHub site (a public repo makes photos public!)
fetch("photos/list.json", { cache: "no-store" }).then(function(r) { return r.ok ? r.json() : null; }).then(function(j) { if (j && j.length) { CFG.photos = j.map(function(p) { return "photos/" + p; }); } }).catch(function() {});
setInterval(function() { if (!PAUSE && !COOK && D) go(1); }, 20000);
setInterval(function() { if (D) { var cur = document.querySelector(".slide.on"); if (cur && /today|night/.test(cur.id)) build(); } $("stage").style.transform = "translate(" + Math.round(Math.random() * 8 - 4) + "px," + Math.round(Math.random() * 8 - 4) + "px)"; }, 30000);
setInterval(load, 5 * 60000);
load();
</script>
